[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recorder-voice-proxy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "starlette==1.6.0",
  "anyio==4.15.1",
  "uvicorn==0.52.4",
  "httpx==0.28.1",
  "PyJWT[crypto]==2.13.0",
  "azure-identity==1.25.3",
  "aiohttp==3.14.3",
  "websockets==17.1",
  "numpy==2.5.2",
  "soxr==1.1.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
