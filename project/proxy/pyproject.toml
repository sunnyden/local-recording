[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "recorder-voice-proxy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "starlette==0.52.1",
  "anyio==4.15.1",
  "uvicorn==0.41.0",
  "httpx==0.28.1",
  "PyJWT[crypto]==2.12.1",
  "azure-identity==1.25.2",
  "aiohttp==3.13.3",
  "websockets==16.0",
  "numpy==2.4.2",
  "soxr==1.0.0",
]

[project.optional-dependencies]
test = ["pytest==9.0.2", "pytest-asyncio==1.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
