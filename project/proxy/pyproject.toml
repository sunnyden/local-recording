[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "recorder-voice-proxy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "starlette==1.10.0",
  "anyio==4.15.1",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "PyJWT[crypto]==2.15.1",
  "azure-identity==1.27.0",
  "aiohttp==3.14.5",
  "websockets==17.3",
  "numpy==2.5.4",
  "soxr==1.1.0",
  "av==19.0.2",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-asyncio==1.4.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
